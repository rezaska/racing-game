<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VANISHING POINT</title>
<link rel="modulepreload" href="./vendor/three/three.module.js">
<link rel="modulepreload" href="./vendor/three/three.core.js">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d0a14; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <pre id="fatal" hidden style="position:fixed;inset:0;margin:0;padding:24px;color:#ffb4a2;background:#0d0a14;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow:auto"></pre>
  <script>
    // Fail visibly. A WebGL page that throws during setup just goes black, and
    // a black screen tells you nothing.
    addEventListener('error', (e) => {
      const el = document.getElementById('fatal');
      el.hidden = false;
      el.textContent += (e.error && e.error.stack ? e.error.stack : e.message) + '\n';
      document.title = 'ERR ' + (e.message || '');
    });
    addEventListener('unhandledrejection', (e) => {
      const el = document.getElementById('fatal');
      el.hidden = false;
      el.textContent += 'unhandled rejection: ' + (e.reason && e.reason.stack || e.reason) + '\n';
      document.title = 'ERR ' + e.reason;
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
